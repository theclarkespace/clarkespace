<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Blog Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="site-branding">
        <a href="/clarkespace/" class="site-title">{{ site.title }}</a>
        <p class="site-tagline">Fun, cosy and crafty!</p>
      </div>
      <nav class="site-nav">
        <a href="/clarkespace/">Home</a>
        <!-- <a href="/clarkespace/crochet/crochetmain/">Crochet</a> -->
        <a href="/clarkespace/about">About</a>
      </nav>
    </div>
  </header>

  <!-- Two-Column Main Layout -->
  <div class="layout-wrapper">
    <main class="main-content">
      <article>
        {{ content }}
      </article>
    </main>

    <!-- Blog Sidebar -->
    <aside class="sidebar">
      <div class="widget">
        <h3>About the Clarke Space</h3>
        <p>Project overviews, inspiration and great ideas.</p>
      </div>

      <div class="widget">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="/clarkespace/crochet/">Crochet Projects</a></li>
          <!-- <li><a href="/projects/">Hardware Projects</a></li> -->
        </ul>
      </div>

      <div class="widget">
        <h3>Recent Additions</h3>
        <ul>
          {% for project in site.crochet limit:3 %}
            <li><a href="{{ site.baseurl }}{{ project.url }}">{{ project.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </aside>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const checkboxes = document.querySelectorAll("article input[type='checkbox']");
  
      checkboxes.forEach((checkbox, index) => {
        // 1. Force enable the checkbox so it's clickable
        checkbox.removeAttribute("disabled");
  
        // 2. Create a unique storage key using URL + list item text + the checkbox index
        const parentLi = checkbox.closest("li");
        const parentText = parentLi ? parentLi.textContent.trim() : `item`;
        const storageKey = `${window.location.pathname}-${parentText}-cb-${index}`;
  
        // 3. Load saved state on page load
        const savedState = localStorage.getItem(storageKey);
        if (savedState !== null) {
          checkbox.checked = savedState === "true";
        }
  
        // 4. Save state on change
        checkbox.addEventListener("change", function () {
          localStorage.setItem(storageKey, checkbox.checked);
        });
      });
    });
  </script>
    
</body>
</html>
